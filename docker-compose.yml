# Production stack for a single VPS:
#   cp .env.production.example .env.production   # fill it in
#   docker compose --env-file .env.production up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: desirelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: desirelink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desirelink -d desirelink"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build:
      context: .
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: https://${DOMAIN:?set DOMAIN}
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://desirelink:${POSTGRES_PASSWORD}@db:5432/desirelink
      NIC_ENC_KEY: ${NIC_ENC_KEY:?set NIC_ENC_KEY}
      HMAC_KEY: ${HMAC_KEY:?set HMAC_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALLOW_CONSOLE_MAIL: ${ALLOW_CONSOLE_MAIL:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - uploads:/data
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U desirelink -d desirelink -Fc -f /backups/desirelink-$$(date +%F).dump &&
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
  web:
