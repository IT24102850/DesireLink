# Render Blueprint: API + Postgres in Singapore (closest region to Sri Lanka).
# The public site is served by Vercel, which proxies /api and /media here with
# a secret header (ORIGIN_SECRET). Direct hits to *.onrender.com get 403.
#
# Dashboard: New > Blueprint > pick this repo. You'll be asked for the
# "sync: false" values below.

databases:
  - name: desirelink-db
    databaseName: desirelink
    user: desirelink
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: [] # no public access; only services inside Render can connect

services:
  - type: web
    name: desirelink-api
    runtime: docker
    plan: starter # persistent disks need a paid instance
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: desirelink-db
          property: connectionString
      # 32-byte keys generated by Render. BACK THESE UP: losing NIC_ENC_KEY
      # makes stored NIC numbers unreadable.
      - key: NIC_ENC_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
      # Same value must be set in the Vercel project as ORIGIN_SECRET.
      - key: ORIGIN_SECRET
        sync: false
      # Public site URL, e.g. https://desirelink.vercel.app
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Brevo SMTP (brevo.com > SMTP & API > SMTP)
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
